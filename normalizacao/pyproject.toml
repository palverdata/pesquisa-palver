[project]
name = "normalizacao"
version = "0.1.0"
description = "Normaliza as colunas de resposta aberta de uma onda com um modelo local"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cuda = ["llama-cpp-python>=0.3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
# A roda publicada nao tem CUDA.
no-binary-package = ["llama-cpp-python"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
