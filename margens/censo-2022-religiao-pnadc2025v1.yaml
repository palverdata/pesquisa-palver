  escala: contagem POPULACIONAL. O percentual de cada religiao dentro de regiao x
    sexo no Censo e aplicado a populacao da mesma celula em margens/pnadc-2025-visita1.yaml,
    entao reg_std e sex_std tem a distribuicao da PNADc. `pct` fica em cada celula
    para auditoria.
