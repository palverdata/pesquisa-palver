  nota_ibge: Resultados preliminares da amostra, estimados a partir de areas de ponderacao
    preliminares.
  definicao: 'relig_std: Catolica Apostolica Romana -> Catolica; Evangelicas -> Evangelica/Protestante;
    Sem religiao -> Sem Religiao/Ateu/Agnostico; Espirita, Umbanda e Candomble, Tradicoes
    indigenas, Outras religiosidades, Nao sabe e Sem declaracao -> Outra.'
  universo: '16 anos ou mais. A tabela comeca em 10 anos: sai 10 a 14 e 1/5 de 15
    a 19, supondo as idades distribuidas por igual dentro da faixa.'
