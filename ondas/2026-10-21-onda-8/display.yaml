# Chaves: README, secao "O JSON da onda".

meta:
  onda: "2026-10-21-onda-8"

# a plataforma so mostra a serie historica a partir da reanalise da onda 2
evolucao: true

# Nada aqui vai para o JSON.
ancoras:

  ordem_escala_15: &ordem_escala_15
    - "Totalmente (4-5)"
    - "Intermediário (3)"
    - "Nem um pouco (1-2)"
    - "Não sei"

  fim_cenario: &fim_cenario
    - "Branco/nulo ou não votaria"
    - "Indecisos"

  ordem_chance: &ordem_chance
    - "Com certeza votaria"
    - "Poderia votar"
    - "Provavelmente não votaria"
    - "Não votaria de jeito nenhum"
    - "Não sei"

  ordem_competencia: &ordem_competencia
    - "Flávio Bolsonaro"
    - "Lula"
    - "Os dois igualmente"
    - "Nenhum dos dois"
    - "Não sei"

  escala_retro: &escala_retro
    mapa:
      "Ficou praticamente igual": "Igual"

  # no 1o turno, quem tem barra propria sao os cinco acima de 2% no TSE
  votou_1r: &votou_1r
    manter:
      - "Flávio Bolsonaro (PL)"
      - "Lula (PT)"
      - "Escritor Augusto Cury (Avante)"
      - "Renan Santos (Missão)"
      - "Ronaldo Caiado (PSD)"
      - "Branco/nulo"
    resto: "Outros"

  fim_votou_1r: &fim_votou_1r
    - "Outros"
    - "Branco/nulo"

  ordem_proposta: &ordem_proposta
    - "Aumenta"
    - "Não muda"
    - "Diminui"
    - "Não sei"

  nota_proposta: &nota_proposta "Se um candidato a presidente se comprometesse com a proposta, a chance de o respondente votar nele aumentaria, diminuiria ou não mudaria."

  nota_trabalho: &nota_trabalho "Base: quem disse estar trabalhando."

# O motor confere esta lista contra calibracao.margens.
amostra:
  - variavel: sex_std
    rotulo: "Gênero"
  - variavel: age_std
    rotulo: "Faixa etária"
  - variavel: reg_std
    rotulo: "Região"
  - variavel: edu_std
    rotulo: "Escolaridade"
  - variavel: inc_std
    rotulo: "Renda familiar"
  - variavel: vote_std
    rotulo: "Voto no 2º turno de 2022"
  - variavel: filiacao_std
    rotulo: "Filiação partidária"
  - variavel: vote_t1_std
    rotulo: "Voto no 1º turno de 2026"

# Cor por rotulo. A chave e o rotulo pos-harmonizacao.
cores:

# Candidatos. O mesmo hex em toda grafia do mesmo ator.
  "Lula (PT)": "#FA5252"
  "Lula": "#FA5252"
  "Flávio Bolsonaro (PL)": "#4C6EF5"
  "Flávio Bolsonaro": "#4C6EF5"
  "Renan Santos (Missão)": "#FAB005"
  "Ronaldo Caiado (PSD)": "#12B886"
  "Escritor Augusto Cury (Avante)": "#15AABF"
  "Outros": "#7950F2"
  "Outros candidatos": "#7950F2"
  "A reeleição de Lula": "#FA5252"
  "A eleição de Flávio Bolsonaro": "#4C6EF5"

# Avaliacao, expectativa e politicas.
  "Aprova": "#2E9E5B"
  "Desaprova": "#DE4B3B"
  "Ótimo/Bom": "#2E9E5B"
  "Regular": "#EFAF3C"
  "Ruim/Péssimo": "#DE4B3B"
  "Melhorou": "#2E9E5B"
  "Igual": "#EFAF3C"
  "Piorou": "#DE4B3B"
  "Vai melhorar": "#2E9E5B"
  "Vai piorar": "#DE4B3B"
  "Apoio": "#2E9E5B"
  "Sou contra": "#DE4B3B"
  "Aumenta": "#2E9E5B"
  "Não muda": "#ADB5BD"
  "Diminui": "#DE4B3B"

# Chance de voto e firmeza do voto.
  "Com certeza votaria": "#2E9E5B"
  "Poderia votar": "#8CBF44"
  "Provavelmente não votaria": "#E87E35"
  "Não votaria de jeito nenhum": "#DE4B3B"
  "Sim, é definitiva": "#2E9E5B"
  "Não, ainda pode mudar": "#E87E35"

# Espectro politico: a mesma escala vale para ideologia e para identidade.
  "Esquerda": "#FA5252"
  "Lulista": "#FA5252"
  "Centro-esquerda": "#E64980"
  "Simpatiza com a esquerda": "#E64980"
  "Direita": "#4C6EF5"
  "Bolsonarista": "#4C6EF5"
  "Centro-direita": "#15AABF"
  "Simpatiza com a direita": "#15AABF"
  "Centro": "#F59F00"
  "Independente": "#F59F00"
  "Sem posicionamento definido": "#8F9498"

# Antipetismo e antibolsonarismo: uma matiz, escurecendo com a intensidade.
  "Totalmente (4-5)": "#862E9C"
  "Intermediário (3)": "#BE4BDB"
  "Nem um pouco (1-2)": "#DA77F2"

# No cruzamento das duas escalas a cor diz quem o eleitor rejeita; o roxo e a
# soma das outras duas.
  "Antipetista e antibolsonarista": "#862E9C"
  "Só antipetista": "#4C6EF5"
  "Só antibolsonarista": "#FA5252"
  "Nenhum dos dois": "#F59F00"
  "Os dois igualmente": "#ADB5BD"

# Bolsa Familia.
  "Sim": "#2E9E5B"
  "Não": "#DE4B3B"

# Residuais: um cinza so para tudo que nao e resposta substantiva.
  "Branco/nulo ou não votaria": "#8F9498"
  "Branco/nulo": "#8F9498"
  "Indecisos, brancos e nulos": "#8F9498"
  "Indecisos": "#ADB5BD"
  "Não sei": "#8F9498"
  "Outro": "#8F9498"
  "Outra": "#8F9498"

secoes:

  - titulo: "2º turno"
    questoes:
      # `chave` nomeia o cenario pelos candidatos: a serie liga as ondas por ela
      - variavel: stimulated_2r_vote_1_h
        chave: lula_flavio
        rotulo: "Lula x Flávio Bolsonaro"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario

      - variavel: vote_2r_definitive
        rotulo: "O voto no 2º turno é definitivo"
        respostas: ["Sim, é definitiva", "Não, ainda pode mudar", "Não sei"]

      - variavel: reason_choice_2r
        chave: motivo_lula_flavio
        rotulo: "Motivo do voto no 2º turno"
        nota: "Pergunta estimulada: o respondente escolheu o principal motivo entre as opções apresentadas, logo após o cenário."
        ordenar: decrescente
        fixar_no_fim: ["Outra", "Não sei"]

      - variavel: change_trigger_2r
        rotulo: "O que faria mudar o voto no 2º turno"
        ordenar: decrescente
        fixar_no_fim: ["Outro", "Não sei"]

      - variavel: chance_vote_flavio_bolsonaro
        rotulo: "Chance de votar em Flávio Bolsonaro"
        respostas: *ordem_chance
      - variavel: chance_vote_lula
        rotulo: "Chance de votar em Lula"
        respostas: *ordem_chance

      - variavel: fear_outcome
        rotulo: "Resultado que causa mais medo"
        ordenar: decrescente
        fixar_no_fim: ["Não sei"]

  - titulo: "1º turno de 2026"
    questoes:
      - variavel: vote_1r_2026
        rotulo: "Voto declarado no 1º turno"
        nota: "Base: quem disse ter votado no 1º turno de 2026."
        harmonizar: *votou_1r
        ordenar: decrescente
        fixar_no_fim: *fim_votou_1r

  - titulo: "Aprovação e Avaliação do Governo"
    questoes:
      - variavel: president_approval
        rotulo: "Aprovação de Lula"
      - variavel: government_evaluation_h
        rotulo: "Avaliação do governo"

  - titulo: "Problemas do Brasil e Expectativas Econômicas"
    questoes:
      - variavel: main_problem_country
        rotulo: "Maior problema do Brasil"
        nota: "Pergunta estimulada: o respondente escolheu entre as opções apresentadas."
        ordenar: decrescente
        fixar_no_fim: ["Outro", "Não sei"]
      - variavel: family_main_problem
        chave: problema_familia
        rotulo: "Maior problema da família"
        nota: "Pergunta estimulada: o respondente escolheu entre as opções apresentadas."
        ordenar: decrescente
        fixar_no_fim: ["Outro", "Não sei"]
      - variavel: economic_macro_retro
        rotulo: "País, últimos 12 meses"
        harmonizar: *escala_retro
      - variavel: economic_pocket_retro
        rotulo: "Família, últimos 12 meses"
        harmonizar: *escala_retro
      - variavel: economic_macro_prosp
        rotulo: "País, próximos 12 meses"
        harmonizar:
          mapa:
            "Vai ficar do mesmo jeito": "Igual"
      - variavel: economic_pocket_prosp
        rotulo: "Família, próximos 12 meses"
        harmonizar:
          mapa:
            "Vai ficar do mesmo jeito": "Igual"

  - titulo: "Quem cuidaria melhor de cada área"
    questoes:
      - variavel: competence_corrupcao
        rotulo: "Combate à corrupção"
        respostas: *ordem_competencia
      - variavel: competence_pobreza
        rotulo: "Combate à pobreza e desigualdade"
        respostas: *ordem_competencia
      - variavel: competence_divida
        rotulo: "Controle da dívida pública"
        respostas: *ordem_competencia
      - variavel: competence_inflacao
        rotulo: "Controle da inflação e do custo de vida"
        respostas: *ordem_competencia
      - variavel: competence_endividamento
        rotulo: "Controle do endividamento das famílias"
        respostas: *ordem_competencia
      - variavel: competence_educacao
        rotulo: "Educação"
        respostas: *ordem_competencia
      - variavel: competence_empregos
        rotulo: "Geração de empregos"
        respostas: *ordem_competencia
      - variavel: competence_infraestrutura
        rotulo: "Investimento em infraestrutura"
        respostas: *ordem_competencia
      - variavel: competence_politica_externa
        rotulo: "Política externa e relações com outros países"
        respostas: *ordem_competencia
      - variavel: competence_saude
        rotulo: "Saúde"
        respostas: *ordem_competencia
      - variavel: competence_seguranca
        rotulo: "Segurança pública"
        respostas: *ordem_competencia

  - titulo: "Políticas Públicas"
    questoes:
      - variavel: public_policy_support_anistia_8_janeiro
        rotulo: "Anistia aos atos de 8 de janeiro"
      - variavel: public_policy_support_porte_de_armas
        rotulo: "Porte de armas"
      - variavel: public_policy_support_casamento_homoafetivo
        rotulo: "Casamento homoafetivo"
      - variavel: public_policy_support_proibir_aborto
        rotulo: "Proibir o aborto"
      - variavel: public_policy_support_terras_indigenas
        rotulo: "Demarcação de terras indígenas"
      - variavel: public_policy_support_cotas
        rotulo: "Cotas em universidades e concursos"
      - variavel: public_policy_support_privatizar_correios
        rotulo: "Privatizar os Correios"
      - variavel: public_policy_support_desvincular_previdencia
        rotulo: "Desvincular a previdência do mínimo"
      - variavel: public_policy_support_pisos_saude_educacao
        rotulo: "Retirar pisos de saúde e educação"
      - variavel: public_policy_support_alinhar_eua
        rotulo: "Alinhar política externa aos EUA"

  - titulo: "Propostas e chance de voto"
    questoes:
      - variavel: proposal_6x1
        rotulo: "Fim da escala 6x1"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_reeleicao
        rotulo: "Fim da reeleição no executivo"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_terras_raras
        rotulo: "Terras raras para empresas estrangeiras"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_imposto_ricos
        rotulo: "Mais imposto para os mais ricos"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_presidios
        rotulo: "Novos presídios de segurança máxima"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_transporte_gratuito
        rotulo: "Transporte gratuito nos fins de semana"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_mandato_stf
        rotulo: "Mandato para ministros do STF"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_divida_mei
        rotulo: "Perdão da dívida dos MEIs"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_maioridade_penal
        rotulo: "Maioridade penal aos 14 anos"
        nota: *nota_proposta
        respostas: *ordem_proposta
      - variavel: proposal_ipva
        rotulo: "Menos impostos sobre automóveis"
        nota: *nota_proposta
        respostas: *ordem_proposta

  - titulo: "Bolsa Família"
    questoes:
      - variavel: receive_pbf
        rotulo: "Recebe Bolsa Família em casa"
        respostas: ["Sim", "Não", "Não sei"]

  - titulo: "Espectro Ideológico e Identificação Política"
    questoes:

      - variavel: ideology
        rotulo: "Espectro Ideológico"
        harmonizar:
          mapa:
            "Não me identifico com um posicionamento definido": "Sem posicionamento definido"

      - variavel: identification_h
        rotulo: "Identificação Política"

      - variavel: neg_identification_antipetista_h
        rotulo: "Antipetismo"
        respostas: *ordem_escala_15
      - variavel: neg_identification_antibolsonarista_h
        rotulo: "Antibolsonarismo"
        respostas: *ordem_escala_15

      - variavel: anti_cruzado
        rotulo: "Antipetismo × antibolsonarismo"
        nota: "Variável derivada do cruzamento das escalas de antipetismo e antibolsonarismo: conta como antipetista, ou antibolsonarista, quem se declarou 4 ou 5. Quem respondeu “Não sei” em uma das duas escalas não é situado num quadrante."
        ordenar: decrescente
        fixar_no_fim: ["Não sei"]

      - variavel: party_affiliation
        rotulo: "Filiação partidária"
      - variavel: party_affiliated
        rotulo: "Partido de filiação"
        nota: "Base: apenas respondentes que declararam ter filiação formal a algum partido político."
        ordenar: decrescente

  - titulo: "Trabalho"
    questoes:
      - variavel: work_status
        rotulo: "Situação de trabalho"
        ordenar: decrescente
        fixar_no_fim: ["Outra situação"]
      - variavel: work_position
        rotulo: "Posição no trabalho principal"
        nota: *nota_trabalho
        ordenar: decrescente
        fixar_no_fim: ["Outro"]
      - variavel: work_sector
        rotulo: "Área do trabalho principal"
        nota: *nota_trabalho
        ordenar: decrescente
        fixar_no_fim: ["Outra"]

  - titulo: "Participação eleitoral"
    questoes:
      - variavel: registered_voter_last_election
        rotulo: "Tinha título regular em 2022"

# O rotulo de recorte nao passa pelo i18n.
recortes:

  - variavel: sex_std
    rotulo: "Sexo"

  - variavel: age_std
    rotulo: "Idade"

  - variavel: race_std
    rotulo: "Cor ou raça"

  - variavel: edu_std
    rotulo: "Escolaridade"

  - variavel: inc_std
    rotulo: "Renda familiar"
    harmonizar:
      mapa:
        "0-2 SM": "Até 2 salários mínimos"
        "2-5 SM": "2 a 5 salários mínimos"
        "5+ SM": "Mais de 5 salários mínimos"

  - variavel: reg_std
    rotulo: "Região"
    harmonizar:
      mapa:
        "N": "Norte"
        "NE": "Nordeste"
        "CO": "Centro-Oeste"
        "SE": "Sudeste"
        "S": "Sul"

  - variavel: vote_std
    rotulo: "Voto no 2º turno de 2022"
    harmonizar:
      mapa:
        "Branco/Nulo": "Branco/Nulo ou Não votei"

  # quem nao votou no 1o turno esta em Branco/Nulo, como na margem
  - variavel: vote_t1_std
    rotulo: "Voto no 1º turno de 2026"
    harmonizar:
      mapa:
        "Augusto Cury": "Outros candidatos"
        "Renan Santos": "Outros candidatos"
        "Ronaldo Caiado": "Outros candidatos"
        "Outros": "Outros candidatos"
        "Branco/Nulo": "Branco/Nulo ou Não votou"
    grupos: ["Lula", "Flávio Bolsonaro", "Outros candidatos", "Branco/Nulo ou Não votou"]

  # transferencia de voto: os candidatos que ficaram fora do 2o turno, cada um
  # no seu grupo. As bases sao pequenas (Caiado tem 54 respostas)
  - variavel: vote_t1_cand
    rotulo: "Voto no 1º turno de 2026 (por candidato)"
    harmonizar:
      mapa:
        "Branco/Nulo": "Branco/Nulo ou Não votou"
    grupos: ["Lula", "Flávio Bolsonaro", "Renan Santos", "Augusto Cury", "Ronaldo Caiado", "Outros", "Branco/Nulo ou Não votou"]

  # ocupacao como recorte: o voto de cada situacao de trabalho. Posicao e area
  # so existem para quem disse estar trabalhando
  - variavel: work_status
    rotulo: "Situação de trabalho"

  - variavel: work_position
    rotulo: "Posição no trabalho principal"

  - variavel: work_sector
    rotulo: "Área do trabalho principal"

  - variavel: stimulated_2r_vote_1_h
    rotulo: "Voto no 2º turno Lula x Flávio"
    harmonizar:
      mapa:
        "Branco/nulo ou não votaria": "Indecisos, brancos e nulos"
        "Indecisos": "Indecisos, brancos e nulos"
    grupos: ["Lula (PT)", "Flávio Bolsonaro (PL)", "Indecisos, brancos e nulos"]

  - variavel: relig_std
    rotulo: "Religião"
    harmonizar:
      mapa:
        "Sem Religião/Ateu/Agnóstico": "Sem religião"

  # Evangelicos abertos por vertente; quem nao e evangelico entra pela religiao declarada.
  - variavel: relig_std_2
    rotulo: "Religião (evangélicos por vertente)"
    mesclar:
      variavel: relig_std
      mapa:
        "Católica": "Católica"
        "Sem Religião/Ateu/Agnóstico": "Sem religião"
        "Outra": "Outra religião"
    grupos: ["Católica", "Protestantes Históricas", "Pentecostais e Neopentecostais", "Outras", "Sem religião", "Outra religião"]

  - variavel: receive_pbf
    rotulo: "Recebe Bolsa Família em casa"
    excluir:
      - "Não sei"

  - variavel: ideol_std
    rotulo: "Espectro Ideológico"
    harmonizar:
      mapa:
        "Centro": "Centro ou sem posicionamento"
        "Sem posicionamento": "Centro ou sem posicionamento"

  - variavel: identification_h
    rotulo: "Identificação Política"
    harmonizar:
      mapa:
        "Sem interesse em política": "Sem interesse ou não sabe"
        "Não sei": "Sem interesse ou não sabe"
    excluir:
      - "Sem interesse ou não sabe"
