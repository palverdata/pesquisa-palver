matrizes:
  chance_voto_2r:
    n_itens: 2
    texto_base: "Para cada um dos candidatos do 2º turno, indique qual é a chance de você votar nele:"
    itens:
      - variavel: chance_vote_flavio_bolsonaro
        rotulo: "Flávio Bolsonaro"
      - variavel: chance_vote_lula
        rotulo: "Lula"

  competencia:
    n_itens: 11
    texto_base: "Na sua opinião, qual destes candidatos seria mais capaz de cuidar de cada uma das áreas abaixo?"
    itens:
      - variavel: competence_corrupcao
        rotulo: "Combate à corrupção"
      - variavel: competence_pobreza
        rotulo: "Combate à pobreza e desigualdade"
      - variavel: competence_divida
        rotulo: "Controle da dívida pública"
      - variavel: competence_inflacao
        rotulo: "Controle da inflação e do custo de vida"
      - variavel: competence_endividamento
        rotulo: "Controle do endividamento das famílias"
      - variavel: competence_educacao
        rotulo: "Educação"
      - variavel: competence_empregos
        rotulo: "Geração de empregos"
      - variavel: competence_infraestrutura
        rotulo: "Investimento em infraestrutura"
      - variavel: competence_politica_externa
        rotulo: "Política externa e relações com outros países"
      - variavel: competence_saude
        rotulo: "Saúde"
      - variavel: competence_seguranca
        rotulo: "Segurança pública"

  neg_identification:
