      - "Lula (PT)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  vote_2r_definitive:
    texto: "Sua opção de voto no 2º turno é definitiva?"
