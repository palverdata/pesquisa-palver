      "Sou independente": "Independente"
      "Não me considero Bolsonarista, mas gosto mais das ideias da direita": "Simpatiza com a direita"
      "Me considero Bolsonarista": "Bolsonarista"
      "Não me interesso por política": "Sem interesse em política"
      "Não sei": "Não sei"

