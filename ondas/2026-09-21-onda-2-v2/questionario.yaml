questoes_nao_exportadas:
  sex:
    texto: "Qual é o seu gênero?"
    motivo: "origem de sex_std; entra na calibracao pela derivada"

  idade:
    texto: "Qual é a sua idade?"
    motivo: "idade em anos; origem das faixas age (propensao) e age_std (calibracao)"

  race:
    texto: "Qual é a sua cor ou raça?"
    motivo: "origem de race_std; entra na calibracao pela derivada"

  edu:
    texto: "Qual é o seu nível de educação?"
    motivo: "origem de edu_std; entra na calibracao pela derivada"

  inc_fam:
    texto: "Qual é a renda mensal da sua família?"
    motivo: "origem de inc_std; entra na calibracao pela derivada"

  relig:
    texto: "Qual é a sua religião?"
    motivo: "origem de relig_std; entra na calibracao pela derivada"

  relig_evang:
    tipo: "radio"
    texto: "Qual é a sua denominação?"
    motivo: "denominacao evangelica; usada apenas em recortes especificos"
    exportar: false

  # texto de quem marcou "Outra" acima, codificado num rótulo por denominação
  denominacao_norm:
    tipo: "tabulada"
    texto: "denominacao_norm"
    titulo: "Se outra, qual é a sua denominação?"
    motivo: "complementa relig_evang; so nos microdados, para desenhar a lista fechada"
    exportar: false

derivadas:

  sex_std:
    origem: sex
    tipo: mapa
    mapa:
      "Homem": "Homem"
      "Mulher": "Mulher"
    niveis:
      - "Homem"
      - "Mulher"

  age:
    origem: idade
    tipo: faixas
    faixas:
      - ate: 24
        rotulo: "16 a 24 anos"
      - ate: 34
        rotulo: "25 a 34 anos"
      - ate: 44
        rotulo: "35 a 44 anos"
      - ate: 59
        rotulo: "45 a 59 anos"
      - rotulo: "60 anos ou mais"
    niveis:
      - "16 a 24 anos"
      - "25 a 34 anos"
      - "35 a 44 anos"
      - "45 a 59 anos"
      - "60 anos ou mais"

  age_std:
    origem: idade
    tipo: faixas
    faixas:
      - ate: 34
        rotulo: "16 a 34 anos"
      - ate: 59
        rotulo: "35 a 59 anos"
      - rotulo: "60 anos ou mais"
    niveis:
      - "16 a 34 anos"
      - "35 a 59 anos"
      - "60 anos ou mais"

  race_std:
    origem: race
    tipo: mapa
    mapa:
      "Branca": "Branca"
      "Preta": "Preta, Parda, Indígena ou Amarela"
      "Parda": "Preta, Parda, Indígena ou Amarela"
      "Amarela": "Preta, Parda, Indígena ou Amarela"
      "Indígena": "Preta, Parda, Indígena ou Amarela"
    niveis:
      - "Branca"
      - "Preta, Parda, Indígena ou Amarela"

  edu_std:
    origem: edu
    tipo: mapa
    mapa:
      "Sem instrução": "Fundamental"
      "Fundamental incompleto": "Fundamental"
      "Fundamental completo": "Fundamental"
      "Médio incompleto": "Fundamental"
      "Médio completo": "Médio"
      "Superior incompleto": "Médio"
      "Superior completo": "Superior"
      "Pós-graduação": "Superior"
    niveis:
      - "Fundamental"
      - "Médio"
      - "Superior"

  inc_std:
    origem: inc_fam
    tipo: mapa
    mapa:
      "Até R$1.621 (Até 1 salário-mínimo)": "0-2 SM"
      "R$1.622-R$3.242 (Mais de 1 até 2 salários-mínimos)": "0-2 SM"
      "R$3.243-R$4.863 (Mais de 2 até 3 salários-mínimos)": "2-5 SM"
      "R$4.864-R$8.105 (Mais de 3 até 5 salários-mínimos)": "2-5 SM"
      "R$8.106-R$16.210 (Mais de 5 até 10 salários-mínimos)": "5+ SM"
      "R$16.211-R$32.420 (Mais de 10 até 20 salários-mínimos)": "5+ SM"
      "R$32.421 ou mais (Mais de 20 salários-mínimos)": "5+ SM"
    niveis:
      - "0-2 SM"
      - "2-5 SM"
      - "5+ SM"

  # Faixas finas de renda, usadas apenas pelo modelo de propensao (R/propensao.R)
  # -- inc_std, acima, e a granularidade usada nas margens e no raking.

  inc_std_2:
    origem: inc_fam
    tipo: mapa
    mapa:
      "Até R$1.621 (Até 1 salário-mínimo)": "0-1 SM"
      "R$1.622-R$3.242 (Mais de 1 até 2 salários-mínimos)": "1-2 SM"
      "R$3.243-R$4.863 (Mais de 2 até 3 salários-mínimos)": "2-3 SM"
      "R$4.864-R$8.105 (Mais de 3 até 5 salários-mínimos)": "3-5 SM"
      "R$8.106-R$16.210 (Mais de 5 até 10 salários-mínimos)": "5+ SM"
      "R$16.211-R$32.420 (Mais de 10 até 20 salários-mínimos)": "5+ SM"
      "R$32.421 ou mais (Mais de 20 salários-mínimos)": "5+ SM"
    niveis:
      - "0-1 SM"
      - "1-2 SM"
      - "2-3 SM"
      - "3-5 SM"
      - "5+ SM"

  relig_std:
    origem: relig
    tipo: mapa_com_resto
    resto: "Outra"
    mapa:
      "Católica": "Católica"
      "Evangélica/Protestante": "Evangélica/Protestante"
      "Sem Religião/Ateu/Agnóstico": "Sem Religião/Ateu/Agnóstico"
    niveis:
      - "Católica"
      - "Evangélica/Protestante"
      - "Sem Religião/Ateu/Agnóstico"
      - "Outra"

  # Vertente evangelica; so quem respondeu a denominacao. Os demais ficam NA e
  # entram no recorte pelo `mesclar` com relig_std.
  relig_std_2:
    origem: relig_evang
    tipo: mapa_com_resto
    resto: "Outras"
    mapa:
      "Batista": "Protestantes Históricas"
      "Presbiteriana": "Protestantes Históricas"
      "Metodista": "Protestantes Históricas"
      "Luterana": "Protestantes Históricas"
      "Congregacional": "Protestantes Históricas"
      "Episcopal Anglicana": "Protestantes Históricas"
      "Adventista do Sétimo Dia": "Protestantes Históricas"
      "Assembleia de Deus": "Pentecostais e Neopentecostais"
      "Congregação Cristã do Brasil": "Pentecostais e Neopentecostais"
      "Evangelho Quadrangular": "Pentecostais e Neopentecostais"
      "Igreja Universal do Reino de Deus": "Pentecostais e Neopentecostais"
      "Igreja Mundial do Poder de Deus": "Pentecostais e Neopentecostais"
    # os tres ultimos niveis so existem via mesclar, no recorte
    niveis:
      - "Protestantes Históricas"
      - "Pentecostais e Neopentecostais"
      - "Outras"
      - "Católica"
      - "Sem religião"
      - "Outra religião"

  ideol_std:
    origem: ideology
    tipo: mapa
    mapa:
      "Esquerda": "Esquerda"
      "Centro-esquerda": "Esquerda"
      "Centro": "Centro"
      "Centro-direita": "Direita"
      "Direita": "Direita"
      "Não me identifico com um posicionamento definido": "Sem posicionamento"
      "Não sei": "Sem posicionamento"
    niveis:
      - "Esquerda"
      - "Centro"
      - "Direita"
      - "Sem posicionamento"

  reg_std:
    origem: uf
    tipo: agrupamento
    grupos:
      "N": ["AC", "AP", "AM", "PA", "RO", "RR", "TO"]
      "NE": ["AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE"]
      "CO": ["DF", "GO", "MT", "MS"]
      "SE": ["ES", "MG", "RJ", "SP"]
      "S": ["PR", "RS", "SC"]
    niveis:
      - "N"
      - "NE"
      - "CO"
      - "SE"
      - "S"

  # Filiacao: a pergunta-filtro manda os nao filiados; o partido so vale para quem disse Sim.
  filiacao_std:
    tipo: voto_pregresso
    filtro_comparecimento:
      variavel: party_affiliation
      valor_nao_votou: "Não"
      destino: "Não filiado"
    origem_voto: party_affiliated
    mapa:
      "PL (Partido Liberal)": "PL"
      "PT (Partido dos Trabalhadores)": "PT"
      "MISSÃO (Partido Missão)": "Missão"
    resto: "Outros filiados"
    vazio_para: "Outros filiados"
    niveis:
      - "Não filiado"
      - "PL"
      - "PT"
      - "Missão"
      - "Outros filiados"

  vote_std:
    tipo: voto_pregresso
    filtro_comparecimento:
      variavel: voted_2r_last_election
      valor_nao_votou: "Não"
      destino: "Branco/Nulo"
    origem_voto: vote_2r_last_election
    mapa:
      "Lula": "Lula"
      "Jair Bolsonaro": "Jair Bolsonaro"
      "Branco/Nulo": "Branco/Nulo"
    vazio_para: "Branco/Nulo"
    niveis:
      - "Lula"
      - "Jair Bolsonaro"
      - "Branco/Nulo"

  anti_std:
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: limiar
    limiar: ["4", "5 - Totalmente"]
    ordem_avaliacao:
      - variavel: neg_identification_antipetista
        valor: "Antipetista"
      - variavel: neg_identification_antibolsonarista
        valor: "Antibolsonarista"
    resto: "Não alinhado"
    niveis:
      - "Antipetista"
      - "Não alinhado"
      - "Antibolsonarista"

  # Cruzamento das duas escalas. Nao confundir com anti_std, que as resolve por
  # precedencia: la o "Antipetista" tambem leva quem rejeita os dois.
  anti_cruzado:
    texto: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera: — Antipetista / — Antibolsonarista"
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: cruzamento
    limiar: ["4", "5 - Totalmente"]
    # a chave e "acima do limiar?" em cada origem, na ordem de `origem`
    quadrantes:
      "sim,sim": "Antipetista e antibolsonarista"
      "sim,nao": "Só antipetista"
      "nao,sim": "Só antibolsonarista"
      "nao,nao": "Nenhum dos dois"
    # situar quem respondeu so uma das duas inventaria a outra metade
    sem_quadrante:
      valores: ["Não sei"]
      destino: "Não sei"
    niveis:
      - "Antipetista e antibolsonarista"
      - "Só antipetista"
      - "Só antibolsonarista"
      - "Nenhum dos dois"
      - "Não sei"

harmonizacao:

  recall_conhecimento:
