        rotulo: "Porte de armas"
      - variavel: public_policy_support_casamento_homoafetivo
        rotulo: "Casamento homoafetivo"
      - variavel: public_policy_support_proibir_aborto
        rotulo: "Proibir o aborto"
      - variavel: public_policy_support_terras_indigenas
        rotulo: "Demarcação de terras indígenas"
      - variavel: public_policy_support_cotas
        rotulo: "Cotas em universidades e concursos"
      - variavel: public_policy_support_privatizar_correios
        rotulo: "Privatizar os Correios"
      - variavel: public_policy_support_desvincular_previdencia
        rotulo: "Desvincular a previdência do mínimo"
