# Chaves: README, secao "O JSON da onda".

meta:
  onda: "2026-08-10"

# Nada aqui vai para o JSON.
ancoras:

  escala_dias: &escala_dias
    mapa:
      "Alguns dias (1 a 3 dias)": "1 a 3 dias"
      "A maioria dos dias (4 a 6 dias)": "4 a 6 dias"

  ordem_dias: &ordem_dias
    - "Todos os dias"
    - "4 a 6 dias"
    - "1 a 3 dias"
    - "Nenhum dia"
    - "Não sei"

  ordem_escala_15: &ordem_escala_15
    - "Totalmente (4-5)"
    - "Intermediário (3)"
    - "Nem um pouco (1-2)"
    - "Não sei"

  escala_recall: &escala_recall
    mapa:
      "Conheço e não votaria de jeito nenhum": "Não votaria de jeito nenhum"
      "Conheço e provavelmente não votaria": "Provavelmente não votaria"
      "Conheço e poderia votar": "Poderia votar"
      "Conheço e com certeza votaria": "Com certeza votaria"
      "Não conheço ou não sei": "Não conhece ou não sabe"

  ordem_recall: &ordem_recall
    - "Com certeza votaria"
    - "Poderia votar"
    - "Provavelmente não votaria"
    - "Não votaria de jeito nenhum"
    - "Não conhece ou não sabe"

  escala_retro: &escala_retro
    mapa:
      "Ficou praticamente igual": "Igual"

  fim_espontanea: &fim_espontanea
    - "Outros"
    - "Branco/nulo, indecisos ou não votaria"

  mesclar_escolheu: &mesclar_escolheu
    variavel: spontaneous_choice
    mapa:
      "Não, ainda não escolhi": "Indeciso / Não Respondeu"
      "Votarei em branco/nulo": "Branco/Nulo"
      "Não pretendo votar": "Não irei votar"
      "Não sei": "Indeciso / Não Respondeu"

  fim_cenario: &fim_cenario
    - "Branco/nulo, indecisos ou não votaria"

# O motor confere esta lista contra calibracao.margens.
amostra:
  - variavel: sex_std
    rotulo: "Gênero"
  - variavel: age_std
    rotulo: "Faixa etária"
  - variavel: reg_std
    rotulo: "Região"
  - variavel: edu_std
    rotulo: "Escolaridade"
  - variavel: inc_std
    rotulo: "Renda familiar"
  - variavel: vote_std
    rotulo: "Voto no 2º turno de 2022"

# Cor por rotulo. A chave e o rotulo pos-harmonizacao.
cores:

# Candidatos. O mesmo hex em toda grafia do mesmo ator, e no numero dele.
  "Lula (PT)": "#FA5252"
  "Lula": "#FA5252"
  "Reeleição de Lula": "#FA5252"
  "13": "#FA5252"
  "Flávio Bolsonaro (PL)": "#4C6EF5"
  "Flávio Bolsonaro": "#4C6EF5"
  "Jair Bolsonaro": "#4C6EF5"
  "Eleição de Flávio Bolsonaro": "#4C6EF5"
  "22": "#4C6EF5"
  "Renan Santos (Missão)": "#FAB005"
  "Renan Santos": "#FAB005"
  "14": "#FAB005"
  "Romeu Zema (Novo)": "#FD7E14"
  "Romeu Zema": "#FD7E14"
  "30": "#FD7E14"
  "Ronaldo Caiado (PSD)": "#12B886"
  "Ronaldo Caiado": "#12B886"
  "55": "#12B886"
  "Samara Martins (UP)": "#E64980"
  "Augusto Cury (Avante)": "#15AABF"
  "Cabo Daciolo (Mobiliza)": "#7950F2"

# Avaliacao e expectativa.
  "Aprova": "#2E9E5B"
  "Desaprova": "#DE4B3B"
  "Ótimo/Bom": "#2E9E5B"
  "Regular": "#EFAF3C"
  "Ruim/Péssimo": "#DE4B3B"
  "Melhorou": "#2E9E5B"
  "Igual": "#EFAF3C"
  "Piorou": "#DE4B3B"
  "Vai melhorar": "#2E9E5B"
  "Vai piorar": "#DE4B3B"

# Espectro politico: a mesma escala vale para ideologia e para identidade.
  "Esquerda": "#FA5252"
  "Lulista": "#FA5252"
  "Centro-esquerda": "#E64980"
  "Simpatiza com a esquerda": "#E64980"
  "Direita": "#4C6EF5"
  "Bolsonarista": "#4C6EF5"
  "Centro-direita": "#15AABF"
  "Simpatiza com a direita": "#15AABF"
  "Centro": "#F59F00"
  "Independente": "#F59F00"
  "Sem posicionamento definido": "#8F9498"

# Reconhecimento e rejeicao.
  "Com certeza votaria": "#2E9E5B"
  "Poderia votar": "#8CBF44"
  "Provavelmente não votaria": "#E87E35"
  "Não votaria de jeito nenhum": "#DE4B3B"

# Antipetismo e antibolsonarismo: uma matiz, escurecendo com a intensidade.
  "Totalmente (4-5)": "#862E9C"
  "Intermediário (3)": "#BE4BDB"
  "Nem um pouco (1-2)": "#DA77F2"

# Residuais: um cinza so para tudo que nao e resposta substantiva.
  "Branco/nulo, indecisos ou não votaria": "#8F9498"
  "Indeciso / Não Respondeu": "#8F9498"
  "Não sei": "#8F9498"
  "Não conhece ou não sabe": "#8F9498"
  "Outra": "#8F9498"
  "Nenhum dos dois ou não sabe": "#8F9498"

secoes:

  - titulo: "1º turno espontânea"
    questoes:

      - variavel: spontaneous_vote_norm
        rotulo: "Voto espontâneo"
        nota: "Estimativas derivadas de perguntas em duas etapas: decisão de voto e voto espontâneo digitado em caixa de texto. Quem disse não ter escolhido, votar em branco ou não votar entra como não-voto."
        mesclar: *mesclar_escolheu
        harmonizar:
          mapa:
            "Lula": "Lula"
            "Flávio Bolsonaro": "Flávio Bolsonaro"
            "Renan Santos": "Renan Santos"
            "Romeu Zema": "Romeu Zema"
            "Ronaldo Caiado": "Ronaldo Caiado"
            "Branco/Nulo": "Branco/nulo, indecisos ou não votaria"
            "Ninguém": "Branco/nulo, indecisos ou não votaria"
            "Não irei votar": "Branco/nulo, indecisos ou não votaria"
            "Indefinido": "Branco/nulo, indecisos ou não votaria"
            "Indeciso / Não Respondeu": "Branco/nulo, indecisos ou não votaria"
          resto: "Outros"
        ordenar: decrescente
        fixar_no_fim: *fim_espontanea

      - variavel: spontaneous_number_norm
        rotulo: "Número do candidato"
        nota: "Estimativas derivadas de perguntas em duas etapas: decisão de voto e número do candidato digitado em caixa de texto. Quem disse não ter escolhido, votar em branco ou não votar entra como não-voto."
        mesclar: *mesclar_escolheu
        harmonizar:
          mapa:
            "13": "13"
            "22": "22"
            "14": "14"
            "30": "30"
            "55": "55"
            "Branco/Nulo": "Branco/nulo, indecisos ou não votaria"
            "Não irei votar": "Branco/nulo, indecisos ou não votaria"
            "Indeciso / Não Respondeu": "Branco/nulo, indecisos ou não votaria"
          resto: "Outros"
        ordenar: decrescente
        fixar_no_fim: *fim_espontanea

  - titulo: "1º turno estimulada"
    questoes:

      - variavel: stimulated_1r_vote_1_h
        rotulo: "Cenário 1"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario

      - variavel: stimulated_1r_vote_2_h
        rotulo: "Cenário 2"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario

  - titulo: "2º turno estimulada"
    questoes:
      - variavel: stimulated_2r_vote_1_h
        rotulo: "Lula x Flávio Bolsonaro"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario
      - variavel: stimulated_2r_vote_2_h
        rotulo: "Lula x Renan Santos"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario
      - variavel: stimulated_2r_vote_3_h
        rotulo: "Lula x Romeu Zema"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario
      - variavel: stimulated_2r_vote_4_h
        rotulo: "Lula x Ronaldo Caiado"
        ordenar: decrescente
        fixar_no_fim: *fim_cenario

      - variavel: fear_outcome
        rotulo: "Resultado que causa medo"
        harmonizar:
          mapa:
            "A reeleição de Lula": "Reeleição de Lula"
            "A eleição de Flávio Bolsonaro": "Eleição de Flávio Bolsonaro"
            "Ambos resultados me causam medo": "Ambos"
            "Nenhum dos dois resultados me causam medo": "Nenhum dos dois ou não sabe"
            "Não sei": "Nenhum dos dois ou não sabe"

  - titulo: "Reconhecimento e Rejeição"
    questoes:
      - variavel: recall_rejection_flavio_bolsonaro_h
        rotulo: "Flávio Bolsonaro"
        harmonizar: *escala_recall
        respostas: *ordem_recall
      - variavel: recall_rejection_lula_h
        rotulo: "Lula"
        harmonizar: *escala_recall
        respostas: *ordem_recall
      - variavel: recall_rejection_renan_santos_h
        rotulo: "Renan Santos"
        harmonizar: *escala_recall
        respostas: *ordem_recall
      - variavel: recall_rejection_romeu_zema_h
        rotulo: "Romeu Zema"
        harmonizar: *escala_recall
        respostas: *ordem_recall
      - variavel: recall_rejection_ronaldo_caiado_h
        rotulo: "Ronaldo Caiado"
        harmonizar: *escala_recall
        respostas: *ordem_recall

  - titulo: "Aprovação e Avaliação do Governo"
    questoes:
      - variavel: president_approval
        rotulo: "Aprovação de Lula"
      - variavel: government_evaluation_h
        rotulo: "Avaliação do governo"
      - variavel: government_issue_evaluation_economy_h
        rotulo: "Economia"
      - variavel: government_issue_evaluation_public_security_h
        rotulo: "Segurança pública"
      - variavel: government_issue_evaluation_health_h
        rotulo: "Saúde"
      - variavel: government_issue_evaluation_education_h
        rotulo: "Educação"
      - variavel: government_issue_evaluation_corruption_h
        rotulo: "Corrupção"
      - variavel: government_issue_evaluation_foreign_policy_h
        rotulo: "Política externa"
      - variavel: government_issue_evaluation_environment_h
        rotulo: "Meio ambiente"

  - titulo: "Problemas do Brasil e Expectativas Econômicas"
    questoes:

# Os seis maiores codigos; o resto vira Outro.
      - variavel: issue_perception
        rotulo: "Maior problema do Brasil"
        harmonizar:
          mapa:
            "Corrupção": "Corrupção"
            "Segurança pública e violência": "Segurança pública e violência"
            "Bolsonarismo e extrema direita": "Bolsonarismo e extrema direita"
            "Política, Congresso e partidos": "Política, Congresso e partidos"
            "Lula e o governo atual": "Lula e o governo atual"
            "Economia, custo de vida e desemprego": "Economia, custo de vida e desemprego"
            "Desemprego": "Economia, custo de vida e desemprego"
            "Indeciso / Não Respondeu": "Indeciso / Não Respondeu"
          resto: "Outro"
        ordenar: decrescente
        fixar_no_fim: ["Outro", "Indeciso / Não Respondeu"]
      - variavel: economic_macro_retro
        rotulo: "País, últimos 12 meses"
        harmonizar: *escala_retro
      - variavel: economic_pocket_retro
        rotulo: "Família, últimos 12 meses"
        harmonizar: *escala_retro
      - variavel: economic_macro_prosp
        rotulo: "País, próximos 12 meses"
        harmonizar:
          mapa:
            "Vai ficar do mesmo jeito": "Igual"
      - variavel: economic_pocket_prosp
        rotulo: "Família, próximos 12 meses"
        harmonizar:
          mapa:
            "Vai ficar do mesmo jeito ": "Igual"  # espaco no fim, como no bruto

  - titulo: "Consumo de Mídia"
    questoes:
      - variavel: media_frequency
        rotulo: "Exposição Política"
        harmonizar: *escala_dias
        respostas: *ordem_dias

      - variavel: media_main_h
        rotulo: "Principal forma de se informar"
        ordenar: decrescente
        fixar_no_fim:
          - "Outra"
          - "Não sei"

      - variavel: media_exposure_television
        rotulo: "Televisão"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_radio
        rotulo: "Rádio"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_print
        rotulo: "Jornais e revistas impressos"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_digital_portals
        rotulo: "Sites e portais digitais"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_youtube
        rotulo: "YouTube"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_instagram
        rotulo: "Instagram"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_facebook
        rotulo: "Facebook"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_tiktok
        rotulo: "TikTok"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_x
        rotulo: "X"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_whatsapp
        rotulo: "WhatsApp"
        harmonizar: *escala_dias
        respostas: *ordem_dias
      - variavel: media_exposure_telegram
        rotulo: "Telegram"
        harmonizar: *escala_dias
        respostas: *ordem_dias

  - titulo: "Identificação Política e Ideológica"
    questoes:

      - variavel: ideology
        rotulo: "Posicionamento ideológico"
        harmonizar:
          mapa:
            "Não me identifico com um posicionamento definido": "Sem posicionamento definido"

      - variavel: identification_h
        rotulo: "Identidade política"

      - variavel: neg_identification_antipetista_h
        rotulo: "Antipetismo"
        respostas: *ordem_escala_15
      - variavel: neg_identification_antibolsonarista_h
        rotulo: "Antibolsonarismo"
        respostas: *ordem_escala_15

  - titulo: "Interesse nas Eleições"
    questoes:
      - variavel: interest_elections
        rotulo: "Interesse na eleição"
      - variavel: vote_1r_planning
        rotulo: "Pretende votar no 1º turno"
      - variavel: voting_frequency
        rotulo: "Frequência com que vota"
      - variavel: registered_same_city
        rotulo: "Vota na cidade onde mora"
# O rotulo de recorte nao passa pelo i18n.
recortes:

  - variavel: sex_std
    rotulo: "Sexo"

  - variavel: age_std
    rotulo: "Idade"

  - variavel: race_std
    rotulo: "Cor ou raça"

  - variavel: edu_std
    rotulo: "Escolaridade"

  - variavel: inc_std
    rotulo: "Renda familiar"
    harmonizar:
      mapa:
        "0-2 SM": "Até 2 salários mínimos"
        "2-5 SM": "2 a 5 salários mínimos"
        "5+ SM": "Mais de 5 salários mínimos"

  - variavel: reg_std
    rotulo: "Região"
    harmonizar:
      mapa:
        "N": "Norte"
        "NE": "Nordeste"
        "CO": "Centro-Oeste"
        "SE": "Sudeste"
        "S": "Sul"

  - variavel: vote_std
    rotulo: "Voto no 2º turno de 2022"
    harmonizar:
      mapa:
        "Branco/Nulo": "Branco/Nulo ou Não votei"

  - variavel: relig_std
    rotulo: "Religião"
    harmonizar:
      mapa:
        "Sem Religião/Ateu/Agnóstico": "Sem religião"

  - variavel: ideol_std
    rotulo: "Ideologia"
    harmonizar:
      mapa:
        "Centro": "Centro ou sem posicionamento"
        "Sem posicionamento": "Centro ou sem posicionamento"

  - variavel: identification_h
    rotulo: "Identidade política"
    harmonizar:
      mapa:
        "Sem interesse em política": "Sem interesse ou não sabe"
        "Não sei": "Sem interesse ou não sabe"
    excluir:
      - "Sem interesse ou não sabe"
