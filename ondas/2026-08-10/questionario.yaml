# ---------------------------------------------------------------------------
# ESTRATIFICACAO (recortes da aba ResultsStrat)
# ---------------------------------------------------------------------------

harmonizacao:

  # recall: nao conhece e nao sabe viram um so rotulo. As alternativas
  # de intencao ficam com o proprio rotulo e nao aparecem no mapa.
  recall_conhecimento:
    aplicar_a:
      - recall_rejection_flavio_bolsonaro
      - recall_rejection_lula
      - recall_rejection_renan_santos
      - recall_rejection_romeu_zema
      - recall_rejection_ronaldo_caiado
    mapa:
      "Não conheço": "Não conheço ou não sei"
      "Não sei": "Não conheço ou não sei"

  # cenario eleitoral: branco/nulo, nao votaria e nao sabe viram um so
  # rotulo. Os candidatos ficam com o proprio rotulo, e por isso nao
  # aparecem no mapa -- cada cenario tem uma lista diferente.
  cenario_eleitoral:
    aplicar_a:
      - stimulated_1r_vote_1
      - stimulated_1r_vote_2
      - stimulated_2r_vote_1
      - stimulated_2r_vote_2
      - stimulated_2r_vote_3
      - stimulated_2r_vote_4
    mapa:
      "Votaria em branco/nulo": "Branco/nulo, não votaria ou não sabe"
      "Não iria votar": "Branco/nulo, não votaria ou não sabe"
      "Não sei": "Branco/nulo, não votaria ou não sabe"

  # Otimo/Bom, Regular, Ruim/Pessimo
  avaliacao_governo:
    aplicar_a:
      - government_evaluation
      - government_issue_evaluation_economy
      - government_issue_evaluation_public_security
      - government_issue_evaluation_health
      - government_issue_evaluation_education
      - government_issue_evaluation_corruption
      - government_issue_evaluation_foreign_policy
      - government_issue_evaluation_environment
    mapa:
      "Ótimo": "Ótimo/Bom"
      "Bom": "Ótimo/Bom"
      "Regular": "Regular"
      "Ruim": "Ruim/Péssimo"
      "Péssimo": "Ruim/Péssimo"
      "Não sei": "Não sei"

  # junta 1 com 2 e 4 com 5; o 3 fica sozinho
  escala_1_5:
    aplicar_a:
      - neg_identification_antipetista
      - neg_identification_antibolsonarista
    mapa:
      "1 - Nem um pouco": "Nem um pouco (1-2)"
      "2": "Nem um pouco (1-2)"
      "3": "Intermediário (3)"
      "4": "Totalmente (4-5)"
      "5 - Totalmente": "Totalmente (4-5)"
      "Não sei": "Não sei"

  # rotulo curto para caber no grafico
  meio_principal:
    aplicar_a:
      - media_main
    mapa:
      "Televisão aberta (Globo, SBT, Band, Record, etc.)": "TV aberta"
      "Televisão fechada (GloboNews, CNN, BandNews, UOLNews, etc.)": "TV fechada (Canais News)"
      "Rádio": "Rádio"
      "Jornais ou revistas impressos": "Jornais Impresso"
      "Sites ou portais digitais": "Portais digitais"
      "Podcasts (Spotify, Apple Podcasts, Amazon Music, Deezer, etc.)": "Podcasts"
      "Plataformas de vídeo/streaming (YouTube, Vimeo, Twitch, Netflix, etc.)": "Vídeo/streaming (Youtube)"
      "Redes sociais (Facebook, Instagram, X, TikTok, Kwai, etc.)": "Redes sociais"
      "Aplicativos de mensagens (WhatsApp, Telegram, Messenger, Discord, Signal, etc.)": "Aplicativos de Mensagens"
      "E-mail/newsletter (Substack, etc.)": "E-mail/newsletter"
      "Conversas presenciais com familiares, amigos ou colegas": "Conversas presenciais"
      "Outra": "Outra"
      "Não sei": "Não sei"

  # rotulo curto para caber no grafico
  identificacao:
    aplicar_a:
      - identification
    mapa:
      "Me considero lulista": "Lulista"
      "Não me considero lulista, mas gosto mais das ideias da esquerda": "Simpatiza com a esquerda"
      "Sou independente": "Independente"
      "Não me considero bolsonarista, mas gosto mais das ideias da direita": "Simpatiza com a direita"
      "Me considero bolsonarista": "Bolsonarista"
      "Não me interesso por política": "Sem interesse em política"
      "Não sei": "Não sei"

