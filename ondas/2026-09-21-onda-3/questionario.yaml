      - "Jair Bolsonaro"
      - "Branco/Nulo"

  anti_std:
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: limiar
    limiar: ["4 - Muito", "5 - Totalmente"]
    ordem_avaliacao:
      - variavel: neg_identification_antipetista
        valor: "Antipetista"
      - variavel: neg_identification_antibolsonarista
        valor: "Antibolsonarista"
    resto: "Não alinhado"
    niveis:
      - "Antipetista"
      - "Não alinhado"
      - "Antibolsonarista"

  # Cruzamento das duas escalas. Nao confundir com anti_std, que as resolve por
  # precedencia: la o "Antipetista" tambem leva quem rejeita os dois.
  anti_cruzado:
    texto: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera: — Antipetista / — Antibolsonarista"
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: cruzamento
    limiar: ["4 - Muito", "5 - Totalmente"]
    # a chave e "acima do limiar?" em cada origem, na ordem de `origem`
    quadrantes:
      "sim,sim": "Antipetista e antibolsonarista"
      "sim,nao": "Só antipetista"
      "nao,sim": "Só antibolsonarista"
      "nao,nao": "Nenhum dos dois"
    # situar quem respondeu so uma das duas inventaria a outra metade
    sem_quadrante:
      valores: ["Não sei"]
      destino: "Não sei"
    niveis:
      - "Antipetista e antibolsonarista"
      - "Só antipetista"
      - "Só antibolsonarista"
      - "Nenhum dos dois"
      - "Não sei"

  # Desgaste de imagem: multipla escolha, um item por resposta. "Nao sei" da
  # lista vira o mesmo nivel de quem nao conhece o caso; quem nao viu a pergunta
  # vem como [None], fica NA e entra pelo mesclar do display.
  desgaste_master:
    texto: "Na sua opinião, quais das seguintes instituições ou grupos políticos sofreram desgaste de imagem em razão do caso do Banco Master?"
    tipo: lista
    origem: damage_master
    nao_perguntado: "None"
    opcoes: ["Banco Central", "Câmara dos Deputados", "Família Bolsonaro", "Lula e o PT", "Senado", "Supremo Tribunal Federal (STF)", "Nenhum dos anteriores", "Não sei"]
    mapa:
      "Não sei": "Não conhece o caso ou não sabe"
    niveis:
      - "Supremo Tribunal Federal (STF)"
      - "Lula e o PT"
      - "Família Bolsonaro"
      - "Senado"
      - "Câmara dos Deputados"
      - "Banco Central"
      - "Nenhum dos anteriores"
      - "Não conhece o caso ou não sabe"

  desgaste_stf:
    texto: "Na sua opinião, quem sofreu desgaste de imagem em razão dos acontecimentos recentes no STF?"
    tipo: lista
    origem: damage_stf
    nao_perguntado: "None"
    opcoes: ["Alexandre de Moraes", "André Mendonça", "Dias Toffoli", "Edson Fachin", "Flávio Bolsonaro", "Flávio Dino", "Gilmar Mendes", "Lula", "Nenhum dos anteriores", "Não sei"]
    mapa:
      "Não sei": "Não conhece o caso ou não sabe"
    niveis:
      - "Alexandre de Moraes"
      - "André Mendonça"
      - "Dias Toffoli"
      - "Edson Fachin"
      - "Flávio Bolsonaro"
      - "Flávio Dino"
      - "Gilmar Mendes"
      - "Lula"
      - "Nenhum dos anteriores"
      - "Não conhece o caso ou não sabe"

