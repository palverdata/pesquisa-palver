      - "Evangélica/Protestante"
      - "Sem Religião/Ateu/Agnóstico"
      - "Outra"

  # Vertente evangelica; so quem respondeu a denominacao. Os demais ficam NA e
  # entram no recorte pelo `mesclar` com relig_std.
  relig_std_2:
    origem: relig_evang
    tipo: mapa_com_resto
    resto: "Outras"
    mapa:
      "Batista": "Protestantes Históricas"
      "Presbiteriana": "Protestantes Históricas"
      "Metodista": "Protestantes Históricas"
      "Luterana": "Protestantes Históricas"
      "Congregacional": "Protestantes Históricas"
      "Episcopal Anglicana": "Protestantes Históricas"
      "Adventista do Sétimo Dia": "Protestantes Históricas"
      "Assembleia de Deus (Ministério de Belém)": "Pentecostais e Neopentecostais"
      "Assembleia de Deus (Ministério de Madureira)": "Pentecostais e Neopentecostais"
      "Assembleia de Deus (Outra)": "Pentecostais e Neopentecostais"
      "Congregação Cristã do Brasil": "Pentecostais e Neopentecostais"
      "Evangelho Quadrangular": "Pentecostais e Neopentecostais"
      "Igreja Pentecostal Deus é Amor": "Pentecostais e Neopentecostais"
      "Igreja Universal do Reino de Deus": "Pentecostais e Neopentecostais"
      "Igreja Internacional da Graça de Deus": "Pentecostais e Neopentecostais"
      "Igreja Mundial do Poder de Deus": "Pentecostais e Neopentecostais"
      "Igreja Batista da Lagoinha": "Pentecostais e Neopentecostais"
    # os tres ultimos niveis so existem via mesclar, no recorte
    niveis:
      - "Protestantes Históricas"
      - "Pentecostais e Neopentecostais"
      - "Outras"
      - "Católica"
      - "Sem religião"
      - "Outra religião"

  ideol_std:
    origem: ideology
    tipo: mapa
    mapa:
      "Esquerda": "Esquerda"
      "Centro-esquerda": "Esquerda"
      "Centro": "Centro"
      "Centro-direita": "Direita"
      "Direita": "Direita"
      "Não me identifico com um posicionamento definido": "Sem posicionamento"
      "Não sei": "Sem posicionamento"
    niveis:
      - "Esquerda"
      - "Centro"
      - "Direita"
      - "Sem posicionamento"

  reg_std:
    origem: uf
    tipo: agrupamento
    grupos:
      "N": ["AC", "AP", "AM", "PA", "RO", "RR", "TO"]
      "NE": ["AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE"]
      "CO": ["DF", "GO", "MT", "MS"]
      "SE": ["ES", "MG", "RJ", "SP"]
