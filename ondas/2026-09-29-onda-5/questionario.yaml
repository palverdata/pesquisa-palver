matrizes:
  recall_rejection:
    n_itens: 6
    texto_base: "Dentre estes possíveis candidatos, gostaria que você me dissesse se você conhece esse candidato e qual a chance de você votar nele:"
    itens:
      - variavel: recall_rejection_flavio_bolsonaro
        rotulo: "Flávio Bolsonaro"
      - variavel: recall_rejection_lula
        rotulo: "Lula"
      - variavel: recall_rejection_renan_santos
        rotulo: "Renan Santos"
      - variavel: recall_rejection_romeu_zema
        rotulo: "Romeu Zema"
      - variavel: recall_rejection_ronaldo_caiado
        rotulo: "Ronaldo Caiado"
      - variavel: recall_rejection_augusto_cury
        rotulo: "Augusto Cury"

  neg_identification:
    n_itens: 2
    texto_base: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera:"
    itens:
      - variavel: neg_identification_antipetista
        rotulo: "Antipetista"
      - variavel: neg_identification_antibolsonarista
        rotulo: "Antibolsonarista"

  public_policy_support:
    n_itens: 10
    texto_base: "Nos últimos anos, o governo e o congresso têm debatido diferentes propostas de políticas públicas. Para cada uma das propostas abaixo, indique se você apoia ou é contra:"
    itens:
      - variavel: public_policy_support_anistia_8_janeiro
        rotulo: "Anistia aos atos de 8 de janeiro"
      - variavel: public_policy_support_porte_de_armas
        rotulo: "Porte de armas"
      - variavel: public_policy_support_casamento_homoafetivo
        rotulo: "Casamento homoafetivo"
      - variavel: public_policy_support_proibir_aborto
        rotulo: "Proibir o aborto"
      - variavel: public_policy_support_terras_indigenas
        rotulo: "Demarcação de terras indígenas"
      - variavel: public_policy_support_cotas
        rotulo: "Cotas em universidades e concursos"
      - variavel: public_policy_support_privatizar_correios
        rotulo: "Privatizar os Correios"
      - variavel: public_policy_support_desvincular_previdencia
        rotulo: "Desvincular a previdência do mínimo"
      - variavel: public_policy_support_pisos_saude_educacao
        rotulo: "Retirar pisos de saúde e educação"
      - variavel: public_policy_support_alinhar_eua
        rotulo: "Alinhar política externa aos EUA"

