onda:
  nome: "03-10-2026 BR-00198/2026"
  sequencia: 6
  registro: "BR-00198/2026"
  data_divulgacao: "2026-10-03"
  descricao: "Pesquisa nacional de intencao de voto para presidente, outubro de 2026 (onda 6)"

campo:
  data_inicio: "2026-09-30"
  data_fim: "2026-10-03"
  # comecaram e nao concluiram; vem do funil da plataforma, nao do export
  desistencia_pct: 45.2

amostra:
  registrada: 5000
  ordenar_por: end_timestamp
  # as 5.000 conclusoes mais recentes do campo, nao as primeiras
  corte: ultimas

margens:
  pnadc: "margens/pnadc-2024-visita5.yaml"
  tse: "margens/tse-2022-turno2.yaml"
  filiacao: "margens/tse-filiacao-2026-08.yaml"

propensao:
  ativo: false
  variaveis: [sex_std, age, edu_std, inc_std_2, reg_std, tipo_mun_std]
  semente: 1234
  arvores: 1000
  no_minimo: 20
  peso_fallback: 1

calibracao:
  margens:
    - [sex_std]
    - [age_std]
    - [edu_std]
    - [inc_std]
    - [inc_std, sex_std, age_std, reg_std]
    - [reg_std, vote_std]
    - [filiacao_std]
  tolerancia: 1.0e-7
  max_iteracoes: 200

trimming:
  teto: null
  piso: null
  strict: true

diagnosticos:
  tolerancia_pp: 3.0
  nivel_confianca: 0.95
  moe_maxima_pp: 4.0

outputs:
  prefixo: "06_results_eleicoes_2026_10_03"
  # microdados ponderados em output/ (fora do git, nunca publicados)
  microdados: true
