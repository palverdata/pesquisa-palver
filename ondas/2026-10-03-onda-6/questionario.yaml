
meta:
  onda: "2026-10-03-onda-6"

colunas:
  survey_id: survey_id
  submission_id: submission_id
  respondent_id: respondent_id
  start_timestamp: start_timestamp
  end_timestamp: end_timestamp
  time_taken: time_taken_seconds
  dispositivo: dispositivo
  estado: uf
  municipio: municipio
  bairro: bairro
  tipo_municipio: tipo_municipio
  regiao: regiao_arquivo

matrizes:
  neg_identification:
    n_itens: 2
    texto_base: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera:"
    itens:
      - variavel: neg_identification_antipetista
        rotulo: "Antipetista"
      - variavel: neg_identification_antibolsonarista
        rotulo: "Antibolsonarista"

questoes:
  spontaneous_choice:
    texto: "Neste ano de 2026 haverá eleição para presidente. Você já escolheu em quem vai votar para presidente em outubro?"
    tipo: "radio"
    niveis:
      - "Sim, já escolhi"
      - "Não, ainda não escolhi"
      - "Votarei em branco/nulo"
      - "Não pretendo votar"
      - "Não sei"

  # um so cenario nesta onda: o cabecalho vem sem "(cenário N)"
  stimulated_1r_vote_1:
    texto: "Se a eleição para presidente fosse acontecer hoje e estes fossem os candidatos, em quem você votaria?"
    tipo: "radio"
    niveis:
      - "Clariana Barão (DC)"
      - "Edmilson Costa (PCB)"
      - "Escritor Augusto Cury (Avante)"
      - "Flávio Bolsonaro (PL)"
      - "Hertz Dias (PSTU)"
      - "Lula (PT)"
      - "Renan Santos (Missão)"
      - "Ronaldo Caiado (PSD)"
      - "Rui Costa Pimenta (PCO)"
      - "Samara (UP)"
      - "Veterinário Wilson Grassi (Democrata)"
      - "Zema (Novo)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  stimulated_2r_vote_1:
    texto: "Em um eventual 2º turno nas próximas eleições para Presidente, como você votaria se estes fossem os candidatos? (cenário 1)"
    tipo: "radio"
    niveis:
      - "Flávio Bolsonaro (PL)"
      - "Lula (PT)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  stimulated_2r_vote_2:
    texto: "Em um eventual 2º turno nas próximas eleições para Presidente, como você votaria se estes fossem os candidatos? (cenário 2)"
    tipo: "radio"
    niveis:
      - "Escritor Augusto Cury (Avante)"
      - "Lula (PT)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  stimulated_2r_vote_3:
    texto: "Em um eventual 2º turno nas próximas eleições para Presidente, como você votaria se estes fossem os candidatos? (cenário 3)"
    tipo: "radio"
    niveis:
      - "Lula (PT)"
      - "Renan Santos (Missão)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  stimulated_2r_vote_4:
    texto: "Em um eventual 2º turno nas próximas eleições para Presidente, como você votaria se estes fossem os candidatos? (cenário 4)"
    tipo: "radio"
    niveis:
      - "Lula (PT)"
      - "Ronaldo Caiado (PSD)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  stimulated_2r_vote_5:
    texto: "Em um eventual 2º turno nas próximas eleições para Presidente, como você votaria se estes fossem os candidatos? (cenário 5)"
    tipo: "radio"
    niveis:
      - "Lula (PT)"
      - "Zema (Novo)"
      - "Ainda não escolhi"
      - "Votaria em branco/nulo"
      - "Não iria votar"
      - "Não sei"

  president_approval:
    texto: "Você aprova ou desaprova a maneira como Lula está lidando com seu trabalho como presidente?"
    tipo: "radio"
    niveis:
      - "Aprova"
      - "Desaprova"
      - "Não sei"

  government_evaluation:
    texto: "Para você, o governo Lula está fazendo um trabalho ótimo, bom, regular, ruim ou péssimo?"
    tipo: "radio"
    niveis:
      - "Ótimo"
      - "Bom"
      - "Regular"
      - "Ruim"
      - "Péssimo"
      - "Não sei"

  receive_pbf:
    texto: "Você ou alguém na sua casa recebe dinheiro do Bolsa Família?"
    tipo: "radio"
    niveis:
      - "Sim"
      - "Não"
      - "Não sei"

  ideology:
    texto: "Qual é seu posicionamento ideológico?"
    tipo: "radio"
    niveis:
      - "Esquerda"
      - "Centro-esquerda"
      - "Centro"
      - "Centro-direita"
      - "Direita"
      - "Não me identifico com um posicionamento definido"
      - "Não sei"

  identification:
    texto: "Qual das seguintes identidades políticas melhor descrevem o seu posicionamento?"
    tipo: "radio"
    niveis:
      - "Me considero Lulista"
      - "Não me considero Lulista, mas gosto mais das ideias da esquerda"
      - "Sou independente"
      - "Não me considero Bolsonarista, mas gosto mais das ideias da direita"
      - "Me considero Bolsonarista"
      - "Não me interesso por política"
      - "Não sei"

  neg_identification_antipetista:
    texto: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera: — Antipetista"
    tipo: "matrix"
    matriz: neg_identification
    niveis:
      - "1 - Nem um pouco"
      - "2 - Pouco"
      - "3 - Moderadamente"
      - "4 - Muito"
      - "5 - Totalmente"
      - "Não sei"

  neg_identification_antibolsonarista:
    texto: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera: — Antibolsonarista"
    tipo: "matrix"
    matriz: neg_identification
    niveis:
      - "1 - Nem um pouco"
      - "2 - Pouco"
      - "3 - Moderadamente"
      - "4 - Muito"
      - "5 - Totalmente"
      - "Não sei"

  voted_2r_last_election:
    texto: "No 1º turno e no 2º turno das eleições de 2022, cerca de 20% dos eleitores não compareceram às urnas. Você votou no 2º turno das eleições de 2022?"
    tipo: "radio"
    niveis:
      - "Sim"
      - "Não"

  vote_2r_last_election:
    texto: "Em quem você votou no 2º turno da eleição presidencial de 2022?"
    tipo: "radio"
    niveis:
      - "Lula"
      - "Jair Bolsonaro"
      - "Branco/Nulo"

  spontaneous_vote_norm:
    tipo: "tabulada"
    texto: "voto_presidente_norm"
    titulo: "Se a eleição para presidente fosse acontecer hoje, em quem você votaria?"
    niveis:
      - "Flávio Bolsonaro"
      - "Lula"
      - "Renan Santos"
      - "Augusto Cury"
      - "Ronaldo Caiado"
      - "Romeu Zema"
      - "Samara Martins"
      - "Eduardo Bolsonaro"
      - "Hertz Dias"
      - "Tarcísio de Freitas"
      - "Jair Bolsonaro"
      - "Carlos Bolsonaro"
      - "Pablo Marçal"
      - "Edmilson Costa"
      - "Rui Costa Pimenta"
      - "Jones Manoel"
      - "Eduardo Leite"
      - "ACM Neto"
      - "Bolsonaro (indefinido)"
      - "Ninguém"
      - "Branco/Nulo"
      # so existe via mesclar: quem disse nao pretender votar nao viu a aberta
      - "Não irei votar"
      # so existe via mesclar: quem disse nao ter escolhido nao viu a aberta
      - "Ainda não escolheu"
      - "Indefinido"
      - "Indeciso / Não Respondeu"

  party_affiliation:
    texto: "Atualmente, você possui filiação formal a algum partido político, registrada na Justiça Eleitoral?"
    tipo: "radio"
    niveis:
      - "Sim"
      - "Não"

  party_affiliated:
    texto: "A qual partido você é filiado?"
    tipo: "radio"
    niveis:
      - "AVANTE (Avante)"
      - "CIDADANIA (Cidadania)"
      - "DC (Democracia Cristã)"
      - "MDB (Movimento Democrático Brasileiro)"
      - "MISSÃO (Partido Missão)"
      - "NOVO (Partido Novo)"
      - "PCdoB (Partido Comunista do Brasil)"
      - "PDT (Partido Democrático Trabalhista)"
      - "PL (Partido Liberal)"
      - "PODE (Podemos)"
      - "PP (Progressistas)"
      - "PRD (Partido Renovação Democrática)"
      - "PSB (Partido Socialista Brasileiro)"
      - "PSD (Partido Social Democrático)"
      - "PSDB (Partido da Social Democracia Brasileira)"
      - "PSOL (Partido Socialismo e Liberdade)"
      - "PT (Partido dos Trabalhadores)"
      - "PV (Partido Verde)"
      - "REPUBLICANOS (Republicanos)"
      - "SOLIDARIEDADE (Solidariedade)"
      - "UNIÃO (União Brasil)"
      - "Outro"
      - "Não sei"

  registered_voter_last_election:
    texto: "Você possuía título de eleitor regularizado e podia votar na eleição de 2022?"
    tipo: "radio"
    niveis:
      - "Sim"
      - "Não"

questoes_nao_exportadas:
  sex:
    texto: "Qual é o seu gênero?"
    motivo: "origem de sex_std; entra na calibracao pela derivada"

  idade:
    texto: "Qual é a sua idade?"
    motivo: "idade em anos; origem das faixas age (propensao) e age_std (calibracao)"

  race:
    texto: "Qual é a sua cor ou raça?"
    motivo: "origem de race_std; entra na calibracao pela derivada"

  edu:
    texto: "Qual é o seu nível de educação?"
    motivo: "origem de edu_std; entra na calibracao pela derivada"

  inc_fam:
    texto: "Qual é a renda mensal da sua família?"
    motivo: "origem de inc_std; entra na calibracao pela derivada"

  relig:
    texto: "Qual é a sua religião?"
    motivo: "origem de relig_std; entra na calibracao pela derivada"

  relig_evang:
    tipo: "radio"
    texto: "Qual é a sua denominação?"
    motivo: "denominacao evangelica em lista fechada de 20; usada apenas em recortes especificos"

derivadas:

  sex_std:
    origem: sex
    tipo: mapa
    mapa:
      "Homem": "Homem"
      "Mulher": "Mulher"
    niveis:
      - "Homem"
      - "Mulher"

  age:
    origem: idade
    tipo: faixas
    faixas:
      - ate: 24
        rotulo: "16 a 24 anos"
      - ate: 34
        rotulo: "25 a 34 anos"
      - ate: 44
        rotulo: "35 a 44 anos"
      - ate: 59
        rotulo: "45 a 59 anos"
      - rotulo: "60 anos ou mais"
    niveis:
      - "16 a 24 anos"
      - "25 a 34 anos"
      - "35 a 44 anos"
      - "45 a 59 anos"
      - "60 anos ou mais"

  age_std:
    origem: idade
    tipo: faixas
    faixas:
      - ate: 34
        rotulo: "16 a 34 anos"
      - ate: 59
        rotulo: "35 a 59 anos"
      - rotulo: "60 anos ou mais"
    niveis:
      - "16 a 34 anos"
      - "35 a 59 anos"
      - "60 anos ou mais"

  race_std:
    origem: race
    tipo: mapa
    mapa:
      "Branca": "Branca"
      "Preta": "Preta, Parda, Indígena ou Amarela"
      "Parda": "Preta, Parda, Indígena ou Amarela"
      "Amarela": "Preta, Parda, Indígena ou Amarela"
      "Indígena": "Preta, Parda, Indígena ou Amarela"
    niveis:
      - "Branca"
      - "Preta, Parda, Indígena ou Amarela"

  edu_std:
    origem: edu
    tipo: mapa
    mapa:
      "Sem instrução": "Fundamental"
      "Fundamental incompleto": "Fundamental"
      "Fundamental completo": "Fundamental"
      "Médio incompleto": "Fundamental"
      "Médio completo": "Médio"
      "Superior incompleto": "Médio"
      "Superior completo": "Superior"
      "Pós-graduação": "Superior"
    niveis:
      - "Fundamental"
      - "Médio"
      - "Superior"

  inc_std:
    origem: inc_fam
    tipo: mapa
    mapa:
      "Até R$1.621 (Até 1 salário-mínimo)": "0-2 SM"
      "R$1.622-R$3.242 (Mais de 1 até 2 salários-mínimos)": "0-2 SM"
      "R$3.243-R$4.863 (Mais de 2 até 3 salários-mínimos)": "2-5 SM"
      "R$4.864-R$8.105 (Mais de 3 até 5 salários-mínimos)": "2-5 SM"
      "R$8.106-R$16.210 (Mais de 5 até 10 salários-mínimos)": "5+ SM"
      "R$16.211-R$32.420 (Mais de 10 até 20 salários-mínimos)": "5+ SM"
      "R$32.421 ou mais (Mais de 20 salários-mínimos)": "5+ SM"
    niveis:
      - "0-2 SM"
      - "2-5 SM"
      - "5+ SM"

  # Faixas finas de renda, usadas apenas pelo modelo de propensao (R/propensao.R)
  # -- inc_std, acima, e a granularidade usada nas margens e no raking.

  inc_std_2:
    origem: inc_fam
    tipo: mapa
    mapa:
      "Até R$1.621 (Até 1 salário-mínimo)": "0-1 SM"
      "R$1.622-R$3.242 (Mais de 1 até 2 salários-mínimos)": "1-2 SM"
      "R$3.243-R$4.863 (Mais de 2 até 3 salários-mínimos)": "2-3 SM"
      "R$4.864-R$8.105 (Mais de 3 até 5 salários-mínimos)": "3-5 SM"
      "R$8.106-R$16.210 (Mais de 5 até 10 salários-mínimos)": "5+ SM"
      "R$16.211-R$32.420 (Mais de 10 até 20 salários-mínimos)": "5+ SM"
      "R$32.421 ou mais (Mais de 20 salários-mínimos)": "5+ SM"
    niveis:
      - "0-1 SM"
      - "1-2 SM"
      - "2-3 SM"
      - "3-5 SM"
      - "5+ SM"

  relig_std:
    origem: relig
    tipo: mapa_com_resto
    resto: "Outra"
    mapa:
      "Católica": "Católica"
      "Evangélica/Protestante": "Evangélica/Protestante"
      "Sem Religião/Ateu/Agnóstico": "Sem Religião/Ateu/Agnóstico"
    niveis:
      - "Católica"
      - "Evangélica/Protestante"
      - "Sem Religião/Ateu/Agnóstico"
      - "Outra"

  # Vertente evangelica; so quem respondeu a denominacao. Os demais ficam NA e
  # entram no recorte pelo `mesclar` com relig_std.
  relig_std_2:
    origem: relig_evang
    tipo: mapa_com_resto
    resto: "Outras"
    mapa:
      "Batista": "Protestantes Históricas"
      "Presbiteriana": "Protestantes Históricas"
      "Metodista": "Protestantes Históricas"
      "Luterana": "Protestantes Históricas"
      "Congregacional": "Protestantes Históricas"
      "Episcopal Anglicana": "Protestantes Históricas"
      "Adventista do Sétimo Dia": "Protestantes Históricas"
      "Assembleia de Deus (Ministério de Belém)": "Pentecostais e Neopentecostais"
      "Assembleia de Deus (Ministério de Madureira)": "Pentecostais e Neopentecostais"
      "Assembleia de Deus (Outra)": "Pentecostais e Neopentecostais"
      "Congregação Cristã do Brasil": "Pentecostais e Neopentecostais"
      "Evangelho Quadrangular": "Pentecostais e Neopentecostais"
      "Igreja Pentecostal Deus é Amor": "Pentecostais e Neopentecostais"
      "Igreja Universal do Reino de Deus": "Pentecostais e Neopentecostais"
      "Igreja Internacional da Graça de Deus": "Pentecostais e Neopentecostais"
      "Igreja Mundial do Poder de Deus": "Pentecostais e Neopentecostais"
      "Igreja Batista da Lagoinha": "Pentecostais e Neopentecostais"
    # os tres ultimos niveis so existem via mesclar, no recorte
    niveis:
      - "Protestantes Históricas"
      - "Pentecostais e Neopentecostais"
      - "Outras"
      - "Católica"
      - "Sem religião"
      - "Outra religião"

  ideol_std:
    origem: ideology
    tipo: mapa
    mapa:
      "Esquerda": "Esquerda"
      "Centro-esquerda": "Esquerda"
      "Centro": "Centro"
      "Centro-direita": "Direita"
      "Direita": "Direita"
      "Não me identifico com um posicionamento definido": "Sem posicionamento"
      "Não sei": "Sem posicionamento"
    niveis:
      - "Esquerda"
      - "Centro"
      - "Direita"
      - "Sem posicionamento"

  reg_std:
    origem: uf
    tipo: agrupamento
    grupos:
      "N": ["AC", "AP", "AM", "PA", "RO", "RR", "TO"]
      "NE": ["AL", "BA", "CE", "MA", "PB", "PE", "PI", "RN", "SE"]
      "CO": ["DF", "GO", "MT", "MS"]
      "SE": ["ES", "MG", "RJ", "SP"]
      "S": ["PR", "RS", "SC"]
    niveis:
      - "N"
      - "NE"
      - "CO"
      - "SE"
      - "S"

  # Filiacao: a pergunta-filtro manda os nao filiados; o partido so vale para quem disse Sim.
  filiacao_std:
    tipo: voto_pregresso
    filtro_comparecimento:
      variavel: party_affiliation
      valor_nao_votou: "Não"
      destino: "Não filiado"
    origem_voto: party_affiliated
    mapa:
      "PL (Partido Liberal)": "PL"
      "PT (Partido dos Trabalhadores)": "PT"
      "MISSÃO (Partido Missão)": "Missão"
    resto: "Outros filiados"
    vazio_para: "Outros filiados"
    niveis:
      - "Não filiado"
      - "PL"
      - "PT"
      - "Missão"
      - "Outros filiados"

  vote_std:
    tipo: voto_pregresso
    filtro_comparecimento:
      variavel: voted_2r_last_election
      valor_nao_votou: "Não"
      destino: "Branco/Nulo"
    origem_voto: vote_2r_last_election
    mapa:
      "Lula": "Lula"
      "Jair Bolsonaro": "Jair Bolsonaro"
      "Branco/Nulo": "Branco/Nulo"
    vazio_para: "Branco/Nulo"
    niveis:
      - "Lula"
      - "Jair Bolsonaro"
      - "Branco/Nulo"

  anti_std:
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: limiar
    limiar: ["4 - Muito", "5 - Totalmente"]
    ordem_avaliacao:
      - variavel: neg_identification_antipetista
        valor: "Antipetista"
      - variavel: neg_identification_antibolsonarista
        valor: "Antibolsonarista"
    resto: "Não alinhado"
    niveis:
      - "Antipetista"
      - "Não alinhado"
      - "Antibolsonarista"

  # Cruzamento das duas escalas. Nao confundir com anti_std, que as resolve por
  # precedencia: la o "Antipetista" tambem leva quem rejeita os dois.
  anti_cruzado:
    texto: "Em uma escala de 1 a 5, em que 1 significa “não me considero nem um pouco” e 5 significa “me considero totalmente”, o quanto você se considera: — Antipetista / — Antibolsonarista"
    origem: [neg_identification_antipetista, neg_identification_antibolsonarista]
    tipo: cruzamento
    limiar: ["4 - Muito", "5 - Totalmente"]
    # a chave e "acima do limiar?" em cada origem, na ordem de `origem`
    quadrantes:
      "sim,sim": "Antipetista e antibolsonarista"
      "sim,nao": "Só antipetista"
      "nao,sim": "Só antibolsonarista"
      "nao,nao": "Nenhum dos dois"
    # situar quem respondeu so uma das duas inventaria a outra metade
    sem_quadrante:
      valores: ["Não sei"]
      destino: "Não sei"
    niveis:
      - "Antipetista e antibolsonarista"
      - "Só antipetista"
      - "Só antibolsonarista"
      - "Nenhum dos dois"
      - "Não sei"

harmonizacao:

  cenario_eleitoral:
    aplicar_a:
      - stimulated_1r_vote_1
      - stimulated_2r_vote_1
      - stimulated_2r_vote_2
      - stimulated_2r_vote_3
      - stimulated_2r_vote_4
      - stimulated_2r_vote_5
    mapa:
      "Ainda não escolhi": "Indecisos"
      "Votaria em branco/nulo": "Branco/nulo ou não votaria"
      "Não iria votar": "Branco/nulo ou não votaria"
      "Não sei": "Indecisos"

  avaliacao_governo:
    aplicar_a:
      - government_evaluation
    mapa:
      "Ótimo": "Ótimo/Bom"
      "Bom": "Ótimo/Bom"
      "Regular": "Regular"
      "Ruim": "Ruim/Péssimo"
      "Péssimo": "Ruim/Péssimo"
      "Não sei": "Não sei"

  escala_1_5:
    aplicar_a:
      - neg_identification_antipetista
      - neg_identification_antibolsonarista
    mapa:
      "1 - Nem um pouco": "Nem um pouco (1-2)"
      "2 - Pouco": "Nem um pouco (1-2)"
      "3 - Moderadamente": "Intermediário (3)"
      "4 - Muito": "Totalmente (4-5)"
      "5 - Totalmente": "Totalmente (4-5)"
      "Não sei": "Não sei"

  identificacao:
    aplicar_a:
      - identification
    mapa:
      "Me considero Lulista": "Lulista"
      "Não me considero Lulista, mas gosto mais das ideias da esquerda": "Simpatiza com a esquerda"
      "Sou independente": "Independente"
      "Não me considero Bolsonarista, mas gosto mais das ideias da direita": "Simpatiza com a direita"
      "Me considero Bolsonarista": "Bolsonarista"
      "Não me interesso por política": "Sem interesse em política"
      "Não sei": "Não sei"

estratificacao:
  - variavel: sex_std
  - variavel: age_std
  - variavel: race_std
  - variavel: edu_std
  - variavel: inc_std
  - variavel: reg_std
